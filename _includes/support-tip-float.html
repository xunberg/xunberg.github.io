{% if site.support.enabled and site.support.show_on_posts %}
<button type="button" class="support-fab" id="support-fab" aria-label="支持作者" aria-haspopup="dialog" aria-controls="support-dialog">
  <i class="fas fa-mug-hot" aria-hidden="true"></i>
  <span class="support-fab__text">支持</span>
</button>
<dialog id="support-dialog" class="support-dialog" aria-labelledby="support-dialog-title">
  <button type="button" class="support-dialog__close" id="support-dialog-close" aria-label="关闭">
    <i class="fas fa-times" aria-hidden="true"></i>
  </button>
  {% include support-tip.html variant="modal" %}
</dialog>
{% endif %}
