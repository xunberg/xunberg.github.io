# Site settings
title: "Xunberg's Tech Blog"
tagline: "MCP · AI Agent · LLM 实战"
description: "Xunberg 技术博客：MCP 协议教程、AI Agent 与 LLM 工程实践、Node-RED/Dify 集成，以及生命科学 Agent 落地系列。含开源项目与踩坑复盘。"
author: "Xunberg"
email: "burgxun@163.com"
url: "https://xunberg.github.io"
baseurl: ""
lang: zh-CN
locale: zh_CN
logo: "/assets/images/og-default.jpg"
image: "/assets/images/og-default.jpg"
twitter:
  card: summary_large_image
last_updated: "2026-10-21"

# Analytics
google_analytics: "G-97GP17YFWB"  # 替换为您的 GA4 测量 ID

# Build settings
markdown: kramdown
highlighter: rouge
theme: jekyll-theme-minimal

# Kramdown settings
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax
  auto_ids: true
  
# Plugins (GitHub Pages 支持的插件)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Navigation
navigation:
  - title: "首页"
    url: "/"
  - title: "MCP 教程"
    url: "/mcp/"
  - title: "Agent 技术"
    url: "/agent/"
  - title: "LLM"
    url: "/llm/"
  - title: "日常分享"
    url: "/daily/"
  - title: "关于"
    url: "/about/"
  - title: "支持作者"
    url: "/support/"

# 打赏 / 支持作者（收款码图片见 assets/images/support/）
support:
  enabled: true
  title: "支持作者"
  intro: "如果这篇文章对你有帮助，欢迎自愿打赏，请我喝杯咖啡。"
  page_url: "/support/"
  show_on_posts: true
  wechat:
    label: "微信"
    image: "/assets/images/support/wechat-pay.jpg"
  alipay:
    label: "支付宝"
    image: "/assets/images/support/alipay.jpg"
  note: "打赏纯属自愿，金额随意。感谢你的阅读与支持！"

# Social links
social:
  github: "xunberg"
  csdn: "https://blog.csdn.net/zxlp520"
  juejin: "https://juejin.cn/user/1239904848969895"
  
# Collections
collections:
  posts:
    output: true
  mcp:
    output: true
    permalink: /mcp/:name/
    sort_by: date
    sort_order: descending
  agent:
    output: true
    permalink: /agent/:name/
    sort_by: date
    sort_order: descending
  llm:
    output: true
    permalink: /llm/:name/
    sort_by: date
    sort_order: descending
  daily:
    output: true
    permalink: /daily/:name/
    sort_by: date
    sort_order: descending

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "mcp"
    values:
      layout: "post"
      author: "Xunberg"
  - scope:
      path: ""
      type: "agent"
    values:
      layout: "post"
      author: "Xunberg"
  - scope:
      path: ""
      type: "llm"
    values:
      layout: "post"
      author: "Xunberg"
  - scope:
      path: ""
      type: "daily"
    values:
      layout: "post"
      author: "Xunberg"
