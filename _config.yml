# Site settings
title: "Xunberg's Tech Blog"
tagline: "实验室自动化 · AI Agent · 数据"
description: "Xunberg 的技术笔记：实验室自动化设备怎样接入大模型，AI Agent 怎样进入生产，以及数据与模型工程。含 MCP、Dify、Node-RED 实践，并持续关注 Anthropic 的 MHS。"
author: "Xunberg"
email: "burgxun@163.com"
url: "https://xunberg.github.io"
baseurl: ""
lang: zh-CN
locale: zh_CN
logo: "/assets/images/og-default.jpg"
image: "/assets/images/og-default.jpg"
twitter:
  card: summary_large_image
last_updated: "2026-10-30"

# Analytics
google_analytics: "G-97GP17YFWB"  # GA4，用于海外与 Google 来源
baidu_tongji: "1cf5122e812e7d43d2c06a7e1c45f282"  # 百度统计，用于国内访问

# Build settings
exclude:
  - draft
  - 用户手册.md
markdown: kramdown
highlighter: rouge
theme: jekyll-theme-minimal

# Kramdown settings
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax
  auto_ids: true
  
# Plugins (GitHub Pages 支持的插件)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Navigation
navigation:
  - title: "首页"
    url: "/"
  - title: "实验室自动化"
    url: "/mcp/"
  - title: "AI Agent"
    url: "/agent/"
  - title: "数据与模型"
    url: "/llm/"
  - title: "工程笔记"
    url: "/daily/"
  - title: "关于"
    url: "/about/"

# 打赏 / 支持作者（入口：文章侧栏、页脚、/support/）（收款码图片见 assets/images/support/）
support:
  enabled: true
  title: "支持作者"
  intro: "如果这篇文章对你有帮助，欢迎自愿打赏，请我喝杯咖啡。"
  sidebar_intro: "有帮助？扫码请我喝杯咖啡"
  page_url: "/support/"
  show_on_posts: true
  post_placement: sidebar
  wechat:
    label: "微信"
    image: "/assets/images/support/wechat-pay.jpg"
  alipay:
    label: "支付宝"
    image: "/assets/images/support/alipay.jpg"
  note: "打赏纯属自愿，金额随意。感谢你的阅读与支持！"

# Social links
social:
  github: "xunberg"
  csdn: "https://blog.csdn.net/zxlp520"
  juejin: "https://juejin.cn/user/1239904848969895"
  
# Collections
collections:
  posts:
    output: true
  mcp:
    output: true
    permalink: /mcp/:name/
    sort_by: date
    sort_order: descending
  agent:
    output: true
    permalink: /agent/:name/
    sort_by: date
    sort_order: descending
  llm:
    output: true
    permalink: /llm/:name/
    sort_by: date
    sort_order: descending
  daily:
    output: true
    permalink: /daily/:name/
    sort_by: date
    sort_order: descending

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "mcp"
    values:
      layout: "post"
      author: "Xunberg"
  - scope:
      path: ""
      type: "agent"
    values:
      layout: "post"
      author: "Xunberg"
  - scope:
      path: ""
      type: "llm"
    values:
      layout: "post"
      author: "Xunberg"
  - scope:
      path: ""
      type: "daily"
    values:
      layout: "post"
      author: "Xunberg"
