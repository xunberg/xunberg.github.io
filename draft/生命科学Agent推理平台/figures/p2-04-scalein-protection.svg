an class="nodeLabel "><p>② 宽限期兜底<br>终止宽限期 &gt; 单任务最大耗时<br>兜底：即使被选中，也能跑完再退</p></span></div></foreignObject></g></g><g class="node default  " id="g-flowchart-P3-6" data-look="classic" transform="translate(198, 515)"><rect class="basic label-container" style="" x="-173.6875" y="-51" width="347.375" height="102"></rect><g class="label" style="" transform="translate(-143.6875, -36)"><rect></rect><foreignObject width="287.375" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 340px; text-align: center;"><span class="nodeLabel "><p>③ 删除优先级<br>忙 Pod 删除代价调高，空闲 Pod 先被删<br>兜底：大幅降低选中忙 Pod 的概率</p></span></div></foreignObject></g></g><g class="node default  " id="g-flowchart-P4-8" data-look="classic" transform="translate(198, 691)"><rect class="basic label-container" style="" x="-190" y="-51" width="380" height="102"></rect><g class="label" style="" transform="translate(-160, -36)"><rect></rect><foreignObject width="320" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 340px; text-align: center;"><span class="nodeLabel "><p>④ 任务可恢复<br>优雅退出重投在途任务 + request_id 幂等<br>兜底：真被杀了也能重跑，且不重复消耗算力</p></span></div></foreignObject></g></g><g class="node default  " id="g-flowchart-OK-10" data-look="classic" transform="translate(198, 819)"><rect class="basic label-container" style="" x="-166" y="-27" width="332" height="54"></rect><g class="label" style="" transform="translate(-136, -12)"><rect></rect><foreignObject width="272" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 340px; text-align: center;"><span class="nodeLabel "><p>最终效果：任务不丢，算力不重复消耗</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="g-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDrop